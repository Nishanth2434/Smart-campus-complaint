services:
  smart-campus-complaint:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-campus-complaint:latest
    container_name: smart-campus-container
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
